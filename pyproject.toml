[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnfactory"
version = "0.1.0"
description = "A lightweight framework for building Physics-Informed Neural Networks (PINNs) from symbolic PDE definitions using SymPy and PyTorch autograd."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Yan Barros" }
]
keywords = [
  "physics-informed-neural-networks", "pinn", "pde", "sympy", "pytorch",
  "scientific-machine-learning", "symbolic-differentiation", "automatic-differentiation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
]

dependencies = [
  "torch>=2.0",
  "sympy>=1.12",
]

[project.optional-dependencies]
# matplotlib/numpy are only needed to run examples/, not the library itself.
examples = [
  "matplotlib>=3.5",
  "numpy>=1.24",
]
dev = [
  "build>=1.2",
  "twine>=5.0",
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/PINNeAPPle-Labs/pinnfactory"
Repository = "https://github.com/PINNeAPPle-Labs/pinnfactory"
Issues = "https://github.com/PINNeAPPle-Labs/pinnfactory/issues"

[tool.setuptools]
# The repo root itself *is* the package source (pinn_generator.py and
# __init__.py live at the top level, not in a "pinnfactory/" subdirectory),
# so map the package name explicitly onto "." rather than using
# packages.find (which looks for a subdirectory matching the package name
# and would find nothing here).
packages = ["pinnfactory"]
package-dir = { "pinnfactory" = "." }

[tool.setuptools.package-data]
pinnfactory = ["README.md"]
